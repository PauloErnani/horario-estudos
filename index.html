<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
<title>Reta Final — UFG &amp; ENEM</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- Firebase Compat (Fácil integração via CDN) -->
<script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore-compat.js"></script>
<style>
  :root{
    --ink:#161A20; --paper:#F6F7F9; --panel:#FFFFFF;
    --exact:#1E3A5F; --exact-bg:#E9F1FA; --exact-bd:#B9CFE8;
    --nat:#25506E; --nat-bg:#EAF3F8; --nat-bd:#BBD6E4;
    --special:#2E6DA4; --special-bg:#EAF4FF; --special-bd:#BFDBFA;
    --physical:#0F6B4C; --physical-bg:#E6F5EE; --physical-bd:#B7E1CC;
    --assess:#6B3FA0; --assess-bg:#F3EAFB; --assess-bd:#DCC4F0;
    --human:#8A5A28; --human-bg:#FBF3E7; --human-bd:#EAD3AE;
    --lang:#1B655F; --lang-bg:#EAF7F6; --lang-bd:#BEE3E0;
    --brk:#6B7280; --brk-bg:#F1F2F4; --brk-bd:#DDE0E4;
  }
  body{font-family:system-ui,sans-serif; background:var(--paper); color:var(--ink);}
  .tab-underline.active::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:3px;background:var(--exact);}
</style>
</head>
<body class="min-h-screen pb-24">

<!-- TELA DE LOGIN -->
<div id="auth-screen" class="flex items-center justify-center min-h-screen px-4">
    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-sm w-full text-center">
        <h1 class="text-2xl font-bold mb-2">Acesso ao Horário</h1>
        <p class="text-sm text-slate-500 mb-6">Entre ou crie uma conta para acessar sua grade sincronizada.</p>
        <input id="email" type="email" placeholder="E-mail" class="w-full border rounded-lg px-4 py-2 mb-3 text-sm" />
        <input id="password" type="password" placeholder="Senha" class="w-full border rounded-lg px-4 py-2 mb-4 text-sm" />
        <div class="flex gap-2">
            <button onclick="login()" class="flex-1 bg-[var(--ink)] text-white py-2 rounded-lg text-sm font-medium">Entrar</button>
            <button onclick="register()" class="flex-1 border border-[var(--ink)] text-[var(--ink)] py-2 rounded-lg text-sm font-medium">Criar Conta</button>
        </div>
        <p id="auth-error" class="text-red-500 text-xs mt-3 hidden"></p>
    </div>
</div>

<!-- TELA DO APLICATIVO -->
<div id="app-screen" class="hidden">
    <header class="max-w-5xl mx-auto px-4 sm:px-6 pt-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold">Meu Horário</h1>
        <button onclick="logout()" class="text-sm text-slate-500 hover:text-red-500">Sair da Conta</button>
    </header>

    <div class="max-w-5xl mx-auto px-4 sm:px-6 mt-6">
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <p class="text-sm text-slate-600">Sincronizado na nuvem. Suas edições são salvas automaticamente.</p>
            <button onclick="openBuilder()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold">+ Adicionar Bloco</button>
        </div>
    </div>

    <!-- Navegação de Dias -->
    <div class="max-w-5xl mx-auto px-4 sm:px-6 mt-6 border-b border-slate-200">
        <nav id="day-tabs" class="flex gap-5 overflow-x-auto text-sm font-medium text-slate-500 pb-2"></nav>
    </div>

    <!-- Lista de Atividades -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 mt-4">
        <div id="schedule-list" class="flex flex-col gap-2 py-2"></div>
        <p class="text-xs text-slate-400 mt-4 text-center" id="empty-state">Nenhuma atividade cadastrada para este dia.</p>
    </main>
</div>

<!-- MODAL DO CONSTRUTOR -->
<div id="builder-modal" class="hidden fixed inset-0 z-40 items-center justify-center bg-black/40 px-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6">
        <h2 class="font-bold mb-4">Adicionar Atividade</h2>
        <div class="grid grid-cols-2 gap-3 mb-3">
            <div>
                <label class="block text-xs text-slate-500 mb-1">Dia da Semana</label>
                <select id="b-day" class="w-full border rounded-lg px-3 py-2 text-sm">
                    <option value="mon">Segunda</option>
                    <option value="tue">Terça</option>
                    <option value="wed">Quarta</option>
                    <option value="thu">Quinta</option>
                    <option value="fri">Sexta</option>
                    <option value="sat">Sábado</option>
                    <option value="sun">Domingo</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-500 mb-1">Categoria (Cor)</label>
                <select id="b-type" class="w-full border rounded-lg px-3 py-2 text-sm">
                    <option value="exact">Exatas (Azul)</option>
                    <option value="human">Humanas (Marrom)</option>
                    <option value="lang">Linguagens (Verde)</option>
                    <option value="physical">Corpo & Saúde (Esmeralda)</option>
                    <option value="brk">Intervalo (Cinza)</option>
                </select>
            </div>
        </div>
        <input id="b-title" type="text" placeholder="Nome da Matéria" class="w-full border rounded-lg px-3 py-2 text-sm mb-3" />
        <input id="b-teacher" type="text" placeholder="Professor (Opcional)" class="w-full border rounded-lg px-3 py-2 text-sm mb-3" />
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div><label class="block text-xs text-slate-500 mb-1">Início</label><input id="b-start" type="time" class="w-full border rounded-lg px-3 py-2 text-sm" /></div>
            <div><label class="block text-xs text-slate-500 mb-1">Fim</label><input id="b-end" type="time" class="w-full border rounded-lg px-3 py-2 text-sm" /></div>
        </div>
        <div class="flex gap-2 justify-end">
            <button onclick="closeBuilder()" class="px-4 py-2 rounded-lg text-sm text-slate-500 hover:bg-slate-50">Cancelar</button>
            <button onclick="saveBlock()" class="px-4 py-2 rounded-lg bg-[var(--ink)] text-white text-sm">Salvar na Nuvem</button>
        </div>
    </div>
</div>

<script>
// ==========================================
// 1. COLE SUAS CHAVES DO FIREBASE AQUI
// ==========================================
const firebaseConfig = {
  apiKey: "AIzaSyBtOgntGP8gJZB2xjrYhO4Ft49v1n-hFAQ",
  authDomain: "horariodeestudos-38455.firebaseapp.com",
  projectId: "horariodeestudos-38455",
  storageBucket: "horariodeestudos-38455.firebasestorage.app",
  messagingSenderId: "298343689620",
  appId: "1:298343689620:web:2d00ab22a535abc1e37381"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ==========================================
// LÓGICA DO APLICATIVO
// ==========================================
let currentUser = null;
let userSchedule = { mon:[], tue:[], wed:[], thu:[], fri:[], sat:[], sun:[] };
let selectedDay = 'mon';

const DAY_ORDER = [
  {key:'mon', label:'Segunda'}, {key:'tue', label:'Terça'}, {key:'wed', label:'Quarta'},
  {key:'thu', label:'Quinta'}, {key:'fri', label:'Sexta'}, {key:'sat', label:'Sábado'}, {key:'sun', label:'Domingo'}
];

const TYPES = {
  exact: '--exact', human: '--human', lang: '--lang', physical: '--physical', brk: '--brk'
};

auth.onAuthStateChanged(user => {
    if (user) {
        currentUser = user;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-screen').classList.remove('hidden');
        loadDataFromCloud();
    } else {
        currentUser = null;
        document.getElementById('auth-screen').classList.remove('hidden');
        document.getElementById('app-screen').classList.add('hidden');
    }
});

function login() {
    const e = document.getElementById('email').value, p = document.getElementById('password').value;
    auth.signInWithEmailAndPassword(e, p).catch(err => showError("Erro ao entrar: Verifique e-mail e senha."));
}

function register() {
    const e = document.getElementById('email').value, p = document.getElementById('password').value;
    auth.createUserWithEmailAndPassword(e, p).catch(err => showError("Erro ao criar conta. A senha deve ter 6+ caracteres."));
}

function logout() { auth.signOut(); }

function showError(msg) {
    const el = document.getElementById('auth-error');
    el.innerText = msg; el.classList.remove('hidden');
}

async function loadDataFromCloud() {
    const doc = await db.collection('schedules').doc(currentUser.uid).get();
    if (doc.exists) userSchedule = doc.data();
    renderTabs();
    renderSchedule();
}

async function syncToCloud() {
    await db.collection('schedules').doc(currentUser.uid).set(userSchedule);
    renderSchedule();
}

function renderTabs() {
    const nav = document.getElementById('day-tabs');
    nav.innerHTML = '';
    DAY_ORDER.forEach(d => {
        const btn = document.createElement('button');
        btn.className = 'tab-underline relative whitespace-nowrap pb-2 ' + (selectedDay===d.key ? 'active font-bold text-[var(--ink)]' : '');
        btn.textContent = d.label;
        btn.onclick = () => { selectedDay = d.key; renderTabs(); renderSchedule(); };
        nav.appendChild(btn);
    });
}

function renderSchedule() {
    const list = document.getElementById('schedule-list');
    const emptyState = document.getElementById('empty-state');
    list.innerHTML = '';
    const blocks = userSchedule[selectedDay] || [];
    
    // Ordena os blocos pelo horário de início
    blocks.sort((a, b) => a.start.localeCompare(b.start));

    if (blocks.length === 0) {
        emptyState.classList.remove('hidden');
    } else {
        emptyState.classList.add('hidden');
        blocks.forEach((blk, index) => {
            const vColor = TYPES[blk.type] || '--exact';
            const row = document.createElement('div');
            row.className = `w-full text-left rounded-xl border px-4 py-3 flex items-center justify-between gap-4 bg-[var(${vColor}-bg)] border-[var(${vColor}-bd)]`;
            row.innerHTML = `
                <div class="flex items-center gap-4 flex-1">
                    <div class="w-16 shrink-0 text-xs font-semibold" style="color:var(${vColor})">${blk.start}<br><span class="font-normal text-slate-400">${blk.end}</span></div>
                    <div class="flex-1 min-w-0">
                        <p class="font-medium truncate" style="color:var(${vColor})">${blk.title}</p>
                        <p class="text-xs text-slate-500 truncate">${blk.teacher || ''}</p>
                    </div>
                </div>
                <button onclick="deleteBlock(${index})" class="text-red-400 hover:text-red-600 text-sm font-bold px-2">&times;</button>
            `;
            list.appendChild(row);
        });
    }
}

function openBuilder() { document.getElementById('builder-modal').classList.remove('hidden'); document.getElementById('builder-modal').classList.add('flex'); }
function closeBuilder() { document.getElementById('builder-modal').classList.add('hidden'); document.getElementById('builder-modal').classList.remove('flex'); }

function saveBlock() {
    const day = document.getElementById('b-day').value;
    const newBlock = {
        type: document.getElementById('b-type').value,
        title: document.getElementById('b-title').value || 'Sem Título',
        teacher: document.getElementById('b-teacher').value,
        start: document.getElementById('b-start').value || '00:00',
        end: document.getElementById('b-end').value || '00:00'
    };
    
    if(!userSchedule[day]) userSchedule[day] = [];
    userSchedule[day].push(newBlock);
    
    syncToCloud();
    closeBuilder();
    document.getElementById('b-title').value = '';
    document.getElementById('b-teacher').value = '';
}

function deleteBlock(index) {
    if(confirm("Excluir esta atividade?")) {
        userSchedule[selectedDay].splice(index, 1);
        syncToCloud();
    }
}
</script>
</body>
</html>
